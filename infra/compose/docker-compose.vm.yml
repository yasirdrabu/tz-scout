# Single VM stack. Secrets and settings come from /opt/scout/.env (see .env.example).
# Run with --env-file so the passwords below resolve:
# Set COMPOSE_PROFILES=tunnel (or public-ip) in /opt/scout/.env so a plain "up -d" starts the edge service.
# Passwords must be URL-safe (they sit inside database URLs): generate with "openssl rand -hex 32".
#   docker compose --env-file /opt/scout/.env -f docker-compose.vm.yml --profile tunnel up -d     (Cloudflare Tunnel)
#   or: docker compose --env-file /opt/scout/.env -f docker-compose.vm.yml --profile public-ip up -d  (Caddy on 443)
x-scout: &scout
  image: ghcr.io/yasirdrabu/tz-scout:${IMAGE_TAG:-latest}
  restart: unless-stopped
  env_file:
    - path: /opt/scout/.env
      required: false # the app refuses to start in production without its secrets
  environment: &scout-env
    NODE_ENV: production
    SCOUT_ENV: production
    DATABASE_URL: postgres://scout_app:${SCOUT_APP_DB_PASSWORD:?set in /opt/scout/.env}@postgres:5432/scout
    DATABASE_ADMIN_URL: postgres://scout_admin:${SCOUT_ADMIN_DB_PASSWORD:?set in /opt/scout/.env}@postgres:5432/scout
    NATS_URL: nats://nats:4222
    SCOUT_BIND_HOST: 0.0.0.0

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in /opt/scout/.env}
      POSTGRES_DB: scout
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U scout -d scout"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.11-alpine
    restart: unless-stopped
    command: ["-js", "-sd", "/data", "-m", "8222"]
    volumes:
      - natsdata:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/healthz || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *scout
    restart: "no"
    command: ["migrate"]
    environment:
      <<: *scout-env
      # Creates the scout_app and scout_admin roles on first run and sets their passwords.
      SCOUT_APP_DB_PASSWORD: ${SCOUT_APP_DB_PASSWORD:?set in /opt/scout/.env}
      SCOUT_ADMIN_DB_PASSWORD: ${SCOUT_ADMIN_DB_PASSWORD:?set in /opt/scout/.env}
      DATABASE_SUPERUSER_URL: postgres://scout:${POSTGRES_PASSWORD:?set in /opt/scout/.env}@postgres:5432/scout
    depends_on:
      postgres:
        condition: service_healthy

  web:
    <<: *scout
    command: ["web"]
    ports:
      - "127.0.0.1:4240:4240"
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4240/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 10

  # Worker, scheduler and relay in one process. Run exactly one of these.
  background:
    <<: *scout
    command: ["all-background"]
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  caddy:
    profiles: ["public-ip"]
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      - web

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.9.1
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run"]
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN:-}
    depends_on:
      - web

  # Nightly pg_dump at 02:00 UTC, copied offsite when BACKUP_REMOTE is set, 14 days kept.
  # Run by hand: docker compose --env-file /opt/scout/.env -f docker-compose.vm.yml run --rm backup /backup.sh
  # Prove a restore: ... run --rm backup /restore-check.sh
  backup:
    image: ghcr.io/yasirdrabu/tz-scout-backup:${IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: scout
      PGPASSWORD: ${POSTGRES_PASSWORD:?set in /opt/scout/.env}
      PGDATABASE: scout
      BACKUP_DIR: /backups
      BACKUP_REMOTE: ${BACKUP_REMOTE:-}
      # rclone remote named r2, configured from the environment (Cloudflare R2 or any S3 bucket).
      RCLONE_CONFIG_R2_TYPE: s3
      RCLONE_CONFIG_R2_NO_CHECK_BUCKET: "true"
      RCLONE_CONFIG_R2_PROVIDER: ${BACKUP_S3_PROVIDER:-Cloudflare}
      RCLONE_CONFIG_R2_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      RCLONE_CONFIG_R2_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      RCLONE_CONFIG_R2_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - backups:/backups
    depends_on:
      postgres:
        condition: service_healthy



volumes:
  pgdata:
  natsdata:
  caddydata:
  caddyconfig:
  backups:
